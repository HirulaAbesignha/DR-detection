# Model Configuration
model:
  architecture: efficientnetb3
  input_size: 224
  num_classes: 5
  dropout_rate: 0.5
  weights: imagenet

# Training Configuration
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.0001
  optimizer: adam
  loss: categorical_crossentropy
  patience: 10

# Data Configuration
data:
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  shuffle: true
  seed: 42
  sample_size: 5000

# Augmentation Configuration
augmentation:
  enabled: true
  horizontal_flip: true
  rotation_range: 15
  brightness_range: [0.8, 1.2]

# Output Configuration
output:
  model_dir: ./models
  log_dir: ./outputs/logs
  plot_dir: ./outputs/plots