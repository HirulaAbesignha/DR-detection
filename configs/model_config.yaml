# Model Configuration
model:
  architecture: efficientnetb3
  input_size: 224
  num_classes: 5
  dropout_rate: 0.5
  weights: imagenet
  
  # Custom head configuration
  dense_units: [512, 256, 128]
  dropout_rates: [0.5, 0.4, 0.3]
  batch_normalization: true

# Training Configuration
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.0001
  optimizer: adam
  loss: categorical_crossentropy
  patience: 10
  
  # Two-stage training
  stage1_epochs: 20  # Frozen base
  stage2_epochs: 20  # Fine-tuning
  fine_tune_from_layer: 100
  fine_tune_learning_rate: 0.00001

# Data Configuration
data:
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  shuffle: true
  seed: 42
  sample_size: 5000

# Augmentation Configuration
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: false
  rotation_range: 15
  brightness_range: [0.8, 1.2]
  zoom_range: 0.1
  shift_range: 0.1
  
  # Class-specific augmentation probabilities
  class_aug_prob:
    0: 0.2  # No DR
    1: 0.4  # Mild
    2: 0.6  # Moderate
    3: 0.8  # Severe
    4: 0.8  # Proliferative

# Preprocessing Configuration
preprocessing:
  clahe_enabled: true
  clahe_clip_limit: 3.0
  clahe_tile_grid_size: [8, 8]
  
  # Normalization
  normalize_method: imagenet  # imagenet, standard, or none
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

# Callbacks Configuration
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 10
    restore_best_weights: true
    mode: min
  
  reduce_lr:
    monitor: val_loss
    factor: 0.5
    patience: 5
    min_lr: 0.0000001
    mode: min
  
  model_checkpoint:
    monitor: val_accuracy
    save_best_only: true
    mode: max
    save_weights_only: false

# Output Configuration
output:
  model_dir: ./models
  log_dir: ./outputs/logs
  plot_dir: ./outputs/plots
  prediction_dir: ./outputs/predictions
  
  # Model naming
  model_name_format: "dr_model_{timestamp}"
  save_format: h5  # h5 or savedmodel

# Hardware Configuration
hardware:
  gpu_memory_limit: 7168  # MB (7GB for 8GB GPU)
  mixed_precision: false  # Set to true for faster training on newer GPUs
  num_workers: 4
  use_multiprocessing: false

# Evaluation Configuration
evaluation:
  batch_size: 16
  generate_gradcam: true
  save_predictions: true
  confusion_matrix: true
  roc_curves: true
  classification_report: true